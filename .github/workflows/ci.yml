name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # Code quality and formatting
  lint:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check code quality
        run: ruff check .

      - name: Check code formatting
        run: ruff format --check .


  # Python and operating system compatibility
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and testing tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov=planar_point_patterns
          --cov-report=term-missing


  # Package building and distribution validation
  build:
    name: Package validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*

      - name: Create clean environment
        run: python -m venv scratch/build-test-env

      - name: Install wheel
        run: >
          scratch/build-test-env/bin/python
          -m pip install dist/*.whl

      - name: Verify package import
        run: >
          scratch/build-test-env/bin/python
          -c "import planar_point_patterns; print(planar_point_patterns.__file__)"

      - name: Check runtime dependencies
        run: >
          scratch/build-test-env/bin/python
          -m pip check
